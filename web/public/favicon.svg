<!-- AI Workspace: a claim tethered to its source.

     The in-app mark is drawn in `currentColor` so it takes the theme, but a favicon has no theme
     to take — it sits on whatever colour the browser paints its tab strip. So this version is
     reversed out of a solid indigo tile, which reads on a light tab bar and a dark one alike.
     Same geometry as web/src/components/brand/BrandMark.tsx, inset to leave the tile a margin. -->
