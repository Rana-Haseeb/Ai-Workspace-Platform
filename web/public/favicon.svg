    <path d="M8 19.4V25.6H18.2" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20.4" y="17.6" width="9.6" height="12" rx="2" fill="#FFFFFF"/>
