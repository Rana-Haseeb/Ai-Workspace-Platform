[pytest]
# The project root on sys.path, so tests import `core.config` / `db.models` the same way the
# application does — no src-layout indirection, no editable install step.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:db.*
    error::DeprecationWarning:services.*
